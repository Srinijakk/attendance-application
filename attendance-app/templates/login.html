<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in - Attendance</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="center-flex">
        <div class="glass login-card">
            <h2>Welcome Back</h2>
            {% if error %}<p class="err">{{ error }}</p>{% endif %}
            <form method="post" action="/login">
                <label>
                    Username
                    <input name="username" autocomplete="username" required autofocus placeholder="Enter your username">
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
                </label>
                <button class="btn" type="submit">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
