<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard - Attendance</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="user-info">
            <strong>Admin Dashboard</strong>
        </div>
        <a href="/logout">Log out</a>
    </header>
    
    <div class="container">
        <div class="glass card" style="padding: 1.5rem; margin-bottom: 2rem;">
            <h3 style="margin-top: 0; margin-bottom: 0.5rem;">Add New Employee</h3>
            <form id="addEmployeeForm" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
                <label style="flex: 1; min-width: 120px; font-size: 0.9em; margin-bottom: 0;">Username
                    <input name="username" placeholder="Username" required style="margin-top: 0.3rem;">
                </label>
                <label style="flex: 1; min-width: 120px; font-size: 0.9em; margin-bottom: 0;">Password
                    <input type="password" name="password" placeholder="Password" required style="margin-top: 0.3rem;">
                </label>
                <button class="btn" type="submit" style="padding: 0.75rem 1.5rem; margin-bottom: 0.2rem;">Add Employee</button>
            </form>
            <div id="addEmployeeMsg" style="margin-top: 1rem; font-size: 0.9em;"></div>
        </div>

        <div class="admin-header">
            <h2>Employee Attendance Records</h2>
            <div>
                <select id="branchFilter" class="date-picker" style="margin-right: 0.5rem; max-width: 150px;">
                    <option value="">All Branches</option>
                    <option value="Deloitte - Prestige trade tower">Deloitte - Prestige trade tower</option>
                    <option value="Deloitte - Ecospace">Deloitte - Ecospace</option>
                    <option value="Lowes">Lowes</option>
                    <option value="IBM - FTP">IBM - FTP</option>
                </select>
                <input type="date" id="datePicker" class="date-picker">
                <button class="btn" id="btnRefresh" style="padding: 0.5rem 1rem; margin-left: 0.5rem;">↻ Refresh</button>
            </div>
        </div>
        
        <div class="glass card" style="padding: 1rem;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Employee Name</th>
                            <th>Picture (In/Out)</th>
                            <th>Location (In)</th>
                            <th>Location (Out)</th>
                            <th>Check-in (IST)</th>
                            <th>Check-out (IST)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align: center;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="/static/admin.js"></script>
</body>
</html>
